<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Helvetica, Arial, sans-serif">
  <!-- farmx_app: schemas in creation order (columns) and what each login can do (rows) -->
  <rect width="780" height="470" fill="#ffffff"/>
  <style>
    .band { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .bandsub { font-size: 10.5px; fill: #ffffff; }
    .schema { font-size: 13px; font-weight: bold; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .login { font-size: 13px; font-weight: bold; fill: #1f2937; font-family: Menlo, Consolas, monospace; }
    .who { font-size: 10.5px; fill: #6b7280; }
    .w { font-size: 12px; font-weight: bold; fill: #ffffff; }
    .r { font-size: 12px; fill: #115e59; }
    .n { font-size: 13px; fill: #9ca3af; }
    .a { font-size: 12px; fill: #374151; }
    .note { font-size: 9.5px; fill: #115e59; }
    .leg { font-size: 11.5px; fill: #374151; }
  </style>

  <!-- Step bands: creation order -->
  <rect x="220" y="10" width="186" height="40" rx="6" fill="#475569"/>
  <text x="313" y="27" text-anchor="middle" class="band">① Section 5 (you, as postgres)</text>
  <text x="313" y="42" text-anchor="middle" class="bandsub">created once, by everyone</text>

  <rect x="410" y="10" width="276" height="40" rx="6" fill="#0f766e"/>
  <text x="548" y="27" text-anchor="middle" class="band">② Section 6: publish-app-db (ETL)</text>
  <text x="548" y="42" text-anchor="middle" class="bandsub">created and refreshed by every publish</text>

  <rect x="690" y="10" width="86" height="40" rx="6" fill="#7c3aed"/>
  <text x="733" y="27" text-anchor="middle" class="band">③ Section 9</text>
  <text x="733" y="42" text-anchor="middle" class="bandsub">your component</text>

  <!-- Schema headers -->
  <text x="266" y="76" text-anchor="middle" class="schema">app</text>
  <text x="358" y="76" text-anchor="middle" class="schema">c1_output</text>
  <text x="456" y="76" text-anchor="middle" class="schema">core</text>
  <text x="548" y="76" text-anchor="middle" class="schema">model_input</text>
  <text x="640" y="76" text-anchor="middle" class="schema">publish</text>
  <text x="733" y="76" text-anchor="middle" class="schema">cN_output</text>
  <line x1="10" y1="88" x2="776" y2="88" stroke="#d1d5db"/>

  <!-- Row: farmx_publisher -->
  <text x="14" y="115" class="login">farmx_publisher</text>
  <text x="14" y="131" class="who">the ETL (publish-app-db)</text>
  <text x="266" y="124" text-anchor="middle" class="n">–</text>
  <text x="358" y="124" text-anchor="middle" class="n">–</text>
  <rect x="412" y="100" width="88" height="40" rx="5" fill="#0f766e"/><text x="456" y="124" text-anchor="middle" class="w">writes</text>
  <rect x="504" y="100" width="88" height="40" rx="5" fill="#0f766e"/><text x="548" y="124" text-anchor="middle" class="w">writes</text>
  <rect x="596" y="100" width="88" height="40" rx="5" fill="#0f766e"/><text x="640" y="124" text-anchor="middle" class="w">writes</text>
  <text x="733" y="124" text-anchor="middle" class="n">–</text>

  <!-- Row: farmx_cN (yours) -->
  <rect x="10" y="148" width="766" height="56" rx="6" fill="#f5f3ff"/>
  <text x="14" y="171" class="login">farmx_cN  ← YOU</text>
  <text x="14" y="187" class="who">your component's model (e.g. farmx_c2)</text>
  <text x="266" y="180" text-anchor="middle" class="n">–</text>
  <text x="358" y="174" text-anchor="middle" class="n">–</text>
  <text x="358" y="192" text-anchor="middle" class="note">(reads if restored)</text>
  <rect x="412" y="156" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="456" y="180" text-anchor="middle" class="r">reads</text>
  <text x="548" y="180" text-anchor="middle" class="n">–</text>
  <rect x="596" y="156" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="640" y="180" text-anchor="middle" class="r">reads</text>
  <rect x="689" y="156" width="88" height="40" rx="5" fill="#7c3aed"/><text x="733" y="180" text-anchor="middle" class="w">writes</text>

  <!-- Row: farmx_model (example: Component 1) -->
  <text x="14" y="227" class="login">farmx_model</text>
  <text x="14" y="243" class="who">example: Component 1 (PFOI) model</text>
  <text x="266" y="236" text-anchor="middle" class="n">–</text>
  <rect x="314" y="212" width="88" height="40" rx="5" fill="#475569"/><text x="358" y="236" text-anchor="middle" class="w">writes</text>
  <rect x="412" y="212" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="456" y="236" text-anchor="middle" class="r">reads</text>
  <rect x="504" y="212" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="548" y="236" text-anchor="middle" class="r">reads</text>
  <rect x="596" y="212" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="640" y="236" text-anchor="middle" class="r">reads</text>
  <text x="733" y="236" text-anchor="middle" class="n">–</text>

  <!-- Row: farmx_api -->
  <text x="14" y="283" class="login">farmx_api</text>
  <text x="14" y="299" class="who">FastAPI backend → React UI</text>
  <rect x="222" y="268" width="88" height="40" rx="5" fill="#475569"/><text x="266" y="292" text-anchor="middle" class="w">writes</text>
  <rect x="314" y="268" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="358" y="292" text-anchor="middle" class="r">reads</text>
  <rect x="412" y="268" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="456" y="292" text-anchor="middle" class="r">reads</text>
  <rect x="504" y="268" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="548" y="292" text-anchor="middle" class="r">reads</text>
  <rect x="596" y="268" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="640" y="292" text-anchor="middle" class="r">reads</text>
  <rect x="689" y="268" width="88" height="40" rx="5" fill="#ccfbf1"/><text x="733" y="292" text-anchor="middle" class="r">reads</text>

  <!-- Row: postgres -->
  <line x1="10" y1="320" x2="776" y2="320" stroke="#e5e7eb"/>
  <text x="14" y="343" class="login">postgres</text>
  <text x="14" y="359" class="who">you in DBeaver, setup only</text>
  <text x="498" y="350" text-anchor="middle" class="a">admin on everything: creates ① and ③, never used by code</text>

  <!-- Not reachable -->
  <rect x="10" y="378" width="766" height="34" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="393" y="400" text-anchor="middle" class="a">None of these logins can open farmx_research (raw · staging · secure hold real IDs)</text>

  <!-- Legend -->
  <rect x="14" y="430" width="22" height="16" rx="3" fill="#0f766e"/><text x="42" y="443" class="leg">dark box = owns and writes</text>
  <rect x="200" y="430" width="22" height="16" rx="3" fill="#ccfbf1"/><text x="228" y="443" class="leg">reads only</text>
  <text x="320" y="443" class="leg"><tspan fill="#9ca3af" font-size="13">–</tspan>  no access</text>
  <text x="420" y="443" class="leg">Box colour = which step creates it (①②③)</text>
</svg>
